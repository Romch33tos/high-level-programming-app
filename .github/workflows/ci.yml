name: CI - Build and Test

on:
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Kotlin Compiler
      run: |
        curl -s https://get.sdkman.io | bash
        source "$HOME/.sdkman/bin/sdkman-init.sh"
        sdk install kotlin

    - name: Grant execute permission for scripts
      run: chmod +x scripts/*.sh

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Build application (Fat JAR)
      run: ./scripts/build.sh

    - name: Run Unit Tests (JUnit)
      run: |
        ./scripts/build_tests.sh
        ./scripts/run_unit_tests.sh

    - name: Init Database
      run: ./scripts/init-db.sh

    - name: Run Integration Tests
      run: ./scripts/integration_test.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java-kotlin"

    - name: Send Telegram Notification (Success)
      if: success()
      continue-on-error: true
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: "✅ CI успешно пройден для PR #${{ github.event.pull_request.number }}"

    - name: Send Telegram Notification (Failure)
      if: failure()
      continue-on-error: true
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: "❌ CI упал для PR #${{ github.event.pull_request.number }}"

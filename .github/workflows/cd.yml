name: CD - Release and Publish

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Grant execute permission for scripts
      run: chmod +x mvnw scripts/*.sh

    - name: Build application
      run: ./mvnw -B clean package -DskipTests

    - name: Run Unit Tests
      run: ./mvnw -B test

    - name: Run Integration Tests
      continue-on-error: true
      run: ./scripts/integration_test.sh

    - name: Build Docker image
      run: |
        docker build -t romch33tos/access-control-app:${{ github.sha }} .
        docker tag romch33tos/access-control-app:${{ github.sha }} romch33tos/access-control-app:latest

    - name: Test Docker image (Success case)
      run: |
        set +e
        docker run --rm romch33tos/access-control-app:${{ github.sha }} --login alice --password qwerty --action read --resource A --volume 10
        EXIT_CODE=$?
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "Ожидался код 0, получен $EXIT_CODE"
          exit 1
        fi
        echo "✅ Код 0 получен успешно"

    - name: Test Docker image (Help case)
      run: |
        set +e
        docker run --rm romch33tos/access-control-app:${{ github.sha }} --help
        EXIT_CODE=$?
        if [ "$EXIT_CODE" -ne 1 ]; then
          echo "Ожидался код 1, получен $EXIT_CODE"
          exit 1
        fi
        echo "✅ Код 1 получен успешно"

    - name: Test Docker image (No Access case)
      run: |
        set +e
        docker run --rm romch33tos/access-control-app:${{ github.sha }} --login alice --password qwerty --action read --resource E --volume 10
        EXIT_CODE=$?
        if [ "$EXIT_CODE" -ne 5 ]; then
          echo "Ожидался код 5, получен $EXIT_CODE"
          exit 1
        fi
        echo "✅ Код 5 получен успешно"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: |
        docker push romch33tos/access-control-app:${{ github.sha }}
        docker push romch33tos/access-control-app:latest

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          Automatic release for commit ${{ github.sha }}
          Docker image: `romch33tos/access-control-app:${{ github.sha }}`
        files: |
          target/access-control-app-*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Telegram Notification (Success)
      if: success()
      continue-on-error: true
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: "✅ CD успешно завершен! Опубликован релиз v1.0.${{ github.run_number }} и Docker-образ для коммита ${{ github.sha }}"

    - name: Send Telegram Notification (Failure)
      if: failure()
      continue-on-error: true
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: "❌ CD упал на коммите ${{ github.sha }}"
